[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "typesearch"
dynamic = ["version"]
description = "Official Python SDK for the typesearch news search API: search for AI agents, with a calibrated relevance score on every result."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "typesearch" }]
keywords = ["typesearch", "news", "news-api", "search", "search-api", "ai", "agents", "llm", "rag", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "typing-extensions>=4.7",
]

[project.urls]
Homepage = "https://typesearch.ai"
Documentation = "https://typesearch.ai/docs/sdks/python"
Repository = "https://github.com/typesearch-ai/typesearch-python"
Issues = "https://github.com/typesearch-ai/typesearch-python/issues"
Changelog = "https://github.com/typesearch-ai/typesearch-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "anyio>=4",
  "jsonschema>=4.21",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.hatch.version]
path = "src/typesearch/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/typesearch"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "scripts", "openapi", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["typesearch"]
branch = true

[tool.coverage.report]
omit = ["*/typesearch/_models.py", "*/typesearch/_params.py"]
show_missing = true

[tool.ruff]
line-length = 140
target-version = "py39"
extend-exclude = ["src/typesearch/_models.py", "src/typesearch/_params.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "UP006", "UP007", "UP035", "UP045", "B904"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/typesearch", "examples"]
plugins = ["pydantic.mypy"]
